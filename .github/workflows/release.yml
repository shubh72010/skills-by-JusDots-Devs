name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            LOG=$(git log --oneline --no-merges | head -n 20)
          else
            LOG=$(git log "$LAST_TAG"..HEAD --oneline --no-merges | head -n 50)
            [ -z "$LOG" ] && LOG=$(git log --oneline --no-merges | head -n 20)
          fi
          {
            echo "log<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Changelog between ${LAST_TAG:-HEAD~} and HEAD:"
          echo "$LOG"

      - name: Package skills
        run: |
          zip -r skills-hub.zip skills/ README.md ARCHITECTURE.md CLAUDE.md AGENTS.md CONTRIBUTING.md LICENSE 2>/dev/null || zip -r skills-hub.zip skills/
          ls -lh skills-hub.zip
          echo "Skills included:"
          unzip -l skills-hub.zip | head -n 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: v${{ github.run_number }}
          body: |
            Auto-release from `${{ github.sha }}` on `main`.

            **Changelog (since last tag):**
            ```
            ${{ steps.changelog.outputs.log }}
            ```

            > Generated release notes below are auto-filled by GitHub.
          generate_release_notes: true
          files: skills-hub.zip
