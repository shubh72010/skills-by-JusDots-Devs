<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="p1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="100%" style="stop-color:#8b5cf6" />
    </linearGradient>
    <linearGradient id="p2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4" />
      <stop offset="100%" style="stop-color:#3b82f6" />
    </linearGradient>
    <linearGradient id="p3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b" />
      <stop offset="100%" style="stop-color:#ef4444" />
    </linearGradient>
    <linearGradient id="p4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899" />
      <stop offset="100%" style="stop-color:#a855f7" />
    </linearGradient>
    <linearGradient id="p5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981" />
      <stop offset="100%" style="stop-color:#059669" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
    <marker id="arr" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" rx="20" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04">
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#f1f5f9" letter-spacing="1">CrossThink — Five-Phase Reasoning Workflow</text>
  <text x="600" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Separation of exploration, independent analysis, synthesis, and critical evaluation</text>

  <!-- ===== PHASE 1 ===== -->
  <rect x="175" y="90" width="260" height="95" rx="16" fill="url(#p1)" filter="url(#shadow)"/>
  <text x="305" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#fff">1. Primary Exploration</text>
  <text x="305" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">Topic deep dive — 7+ dimensions</text>
  <text x="305" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.65)">Fundamentals, assumptions, strengths, weaknesses,</text>
  <text x="305" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.65)">opportunities, limitations, future</text>

  <!-- Arrow 1→2 -->
  <path d="M435 137 L460 137 L460 137 L480 137" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== PHASE 2 ===== -->
  <rect x="480" y="90" width="240" height="95" rx="16" fill="url(#p2)" filter="url(#shadow)"/>
  <text x="600" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#fff">2. Independent Domains</text>
  <text x="600" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">2–4 distant domains</text>
  <text x="600" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.65)">Biology, economics, aviation,</text>
  <text x="600" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.65)">architecture — equal depth, no references</text>

  <!-- Down arrow 2→3 -->
  <line x1="600" y1="185" x2="600" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Horizontal connector -->
  <line x1="600" y1="185" x2="450" y2="185" stroke="#64748b" stroke-width="2"/>
  <!-- Down to phase 3 -->
  <line x1="450" y1="185" x2="450" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== PHASE 3 ===== -->
  <rect x="175" y="218" width="260" height="95" rx="16" fill="url(#p3)" filter="url(#shadow)"/>
  <text x="305" y="256" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#fff">3. Cross-Pollination</text>
  <text x="305" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">Now search for structural relationships</text>
  <text x="305" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.65)">Shared patterns, transferable ideas,</text>
  <text x="305" y="311" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.65)">analogous systems, hidden assumptions</text>

  <!-- Arrow 3→4 -->
  <line x1="435" y1="265" x2="460" y2="265" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== PHASE 4 ===== -->
  <rect x="480" y="218" width="240" height="95" rx="16" fill="url(#p4)" filter="url(#shadow)"/>
  <text x="600" y="256" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#fff">4. Challenge</text>
  <text x="600" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">Subject every idea to scrutiny</text>
  <text x="600" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.65)">Realism, assumptions, evidence,</text>
  <text x="600" y="311" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.65)">prior art, failure modes → discard weak</text>

  <!-- Down arrow 4→5 -->
  <line x1="600" y1="313" x2="600" y2="343" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="600" y1="313" x2="450" y2="313" stroke="#64748b" stroke-width="2"/>
  <line x1="450" y1="313" x2="450" y2="343" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== PHASE 5 ===== -->
  <rect x="175" y="346" width="260" height="95" rx="16" fill="url(#p5)" filter="url(#shadow)"/>
  <text x="305" y="384" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#fff">5. Final Synthesis</text>
  <text x="305" y="406" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">Strongest insights, provenance explained</text>
  <text x="305" y="424" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.65)">Novel concepts, recommendations,</text>
  <text x="305" y="439" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.65)">open questions, future directions</text>

  <!-- ===== LEFT SIDEBAR: Principles ===== -->
  <rect x="20" y="90" width="130" height="351" rx="12" fill="rgba(15,23,42,0.7)" stroke="rgba(100,116,139,0.25)" stroke-width="1"/>
  <text x="85" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">PRINCIPLES</text>
  <line x1="35" y1="120" x2="135" y2="120" stroke="rgba(100,116,139,0.3)" stroke-width="0.5"/>

  <text x="30" y="142" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">① Generate freely — no</text>
  <text x="30" y="158" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">    evaluation in phases 1–2</text>
  <text x="30" y="180" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">② Detach completely</text>
  <text x="30" y="196" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">    — Phase 2 is independent</text>
  <text x="30" y="218" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">③ Find structure — not</text>
  <text x="30" y="234" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">    surface analogies in Phase 3</text>
  <text x="30" y="256" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">④ Be skeptical — evaluate</text>
  <text x="30" y="272" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">    rigorously in Phase 4</text>
  <text x="30" y="294" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">⑤ Prove your reasoning</text>
  <text x="30" y="310" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">    — every insight needs</text>
  <text x="30" y="326" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">    a provenance trail</text>

  <!-- RIGHT SIDEBAR: Failure Modes + Eval -->
  <rect x="1050" y="90" width="130" height="351" rx="12" fill="rgba(15,23,42,0.7)" stroke="rgba(100,116,139,0.25)" stroke-width="1"/>
  <text x="1115" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">FAILURE MODES</text>
  <line x1="1065" y1="120" x2="1165" y2="120" stroke="rgba(100,116,139,0.3)" stroke-width="0.5"/>

  <text x="1060" y="140" font-family="system-ui, sans-serif" font-size="9" fill="#f87171">✗ Shallow exploration</text>
  <text x="1060" y="156" font-family="system-ui, sans-serif" font-size="9" fill="#f87171">✗ Anchoring bias</text>
  <text x="1060" y="172" font-family="system-ui, sans-serif" font-size="9" fill="#f87171">✗ Forced connections</text>
  <text x="1060" y="188" font-family="system-ui, sans-serif" font-size="9" fill="#f87171">✗ Premature synthesis</text>
  <text x="1060" y="204" font-family="system-ui, sans-serif" font-size="9" fill="#f87171">✗ yes-machining ideas</text>
  <text x="1060" y="220" font-family="system-ui, sans-serif" font-size="9" fill="#f87171">✗ Domain selection bias</text>
  <text x="1060" y="236" font-family="system-ui, sans-serif" font-size="9" fill="#f87171">✗ Missing provenance</text>

  <text x="1115" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">EVALUATION</text>
  <line x1="1065" y1="280" x2="1165" y2="280" stroke="rgba(100,116,139,0.3)" stroke-width="0.5"/>

  <text x="1060" y="298" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">✓ All 5 phases executed</text>
  <text x="1060" y="314" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">✓ Ideas rated Strong/Weak</text>
  <text x="1060" y="330" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">✓ Non-obvious connections</text>
  <text x="1060" y="346" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">✓ Insights have provenance</text>

  <!-- Bottom -->
  <text x="600" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">CrossThink — a structured reasoning methodology that reduces anchoring bias</text>
</svg>
