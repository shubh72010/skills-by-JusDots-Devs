<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="diffAdd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a2a"/>
      <stop offset="100%" style="stop-color:#0d2818"/>
    </linearGradient>
    <linearGradient id="diffDel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a1a1a"/>
      <stop offset="100%" style="stop-color:#280d0d"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="1200" height="900" rx="20" fill="url(#bg)"/>
  <text x="600" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#f0f6fc">CrossThink — Diff Workflow</text>
  <text x="600" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">each phase transforms the reasoning state like a diff hunk</text>
  <!-- Phase label bar -->
  <rect x="40" y="72" width="1120" height="30" rx="6" fill="rgba(22,27,34,0.8)" stroke="#30363d" stroke-width="1"/>
  <rect x="60" y="80" width="62" height="14" rx="3" fill="#6366f1"/>
  <text x="91" y="91" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#fff">1</text>
  <text x="135" y="91" text-anchor="middle" font-family="monospace" font-size="8" fill="#484f58">&#x2192;</text>
  <rect x="155" y="80" width="62" height="14" rx="3" fill="#06b6d4"/>
  <text x="186" y="91" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#fff">2</text>
  <text x="230" y="91" text-anchor="middle" font-family="monospace" font-size="8" fill="#484f58">&#x2192;</text>
  <rect x="250" y="80" width="62" height="14" rx="3" fill="#f59e0b"/>
  <text x="281" y="91" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#fff">3</text>
  <text x="325" y="91" text-anchor="middle" font-family="monospace" font-size="8" fill="#484f58">&#x2192;</text>
  <rect x="345" y="80" width="62" height="14" rx="3" fill="#ec4899"/>
  <text x="376" y="91" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#fff">4</text>
  <text x="420" y="91" text-anchor="middle" font-family="monospace" font-size="8" fill="#484f58">&#x2192;</text>
  <rect x="440" y="80" width="62" height="14" rx="3" fill="#10b981"/>
  <text x="471" y="91" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#fff">5</text>
  <!-- Phase 1 -->
  <rect x="40" y="110" width="1120" height="90" rx="8" fill="url(#diffAdd)" filter="url(#shadow)"/>
  <rect x="40" y="110" width="1120" height="22" rx="8" fill="rgba(0,0,0,0.35)"/>
  <text x="56" y="125" font-family="monospace" font-size="9" fill="#f0f6fc" font-weight="600">diff --phase 0..1  (primary exploration)</text>
  <text x="1095" y="125" font-family="monospace" font-size="8" fill="#8b949e">+7 dimensions</text>
  <text x="56" y="148" font-family="monospace" font-size="10" fill="#f0f6fc">+ fundamentals   core principles and first principles</text>
  <text x="56" y="164" font-family="monospace" font-size="10" fill="#f0f6fc">+ assumptions    question the unquestioned</text>
  <text x="56" y="180" font-family="monospace" font-size="10" fill="#f0f6fc">+ strengths      what makes it powerful</text>
  <text x="56" y="196" font-family="monospace" font-size="10" fill="#f0f6fc">+ weaknesses     where it breaks down</text>
  <text x="56" y="212" font-family="monospace" font-size="10" fill="#f0f6fc">[+ opportunities | limitations | related tech | alternatives | questions | future]</text>
  <!-- Arrow -->
  <text x="600" y="248" text-anchor="middle" font-family="monospace" font-size="18" fill="#64748b">&#x25BC;</text>
  <text x="600" y="262" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#484f58">transition: analyze then detach</text>
  <!-- Phase 2 -->
  <rect x="40" y="270" width="1120" height="90" rx="8" fill="url(#diffAdd)" filter="url(#shadow)"/>
  <rect x="40" y="270" width="1120" height="22" rx="8" fill="rgba(0,0,0,0.35)"/>
  <text x="56" y="285" font-family="monospace" font-size="9" fill="#f0f6fc" font-weight="600">diff --phase 1..2  (independent domains)</text>
  <text x="1095" y="285" font-family="monospace" font-size="8" fill="#8b949e">+2-4 domains</text>
  <text x="56" y="308" font-family="monospace" font-size="10" fill="#f0f6fc">+ biology          immune system, symbiosis, adaptation</text>
  <text x="56" y="324" font-family="monospace" font-size="10" fill="#f0f6fc">+ aviation         checklists, redundancy, crew resource mgmt</text>
  <text x="56" y="340" font-family="monospace" font-size="10" fill="#f0f6fc">+ economics        mechanism design, incentive alignment</text>
  <text x="56" y="356" font-family="monospace" font-size="10" fill="#f0f6fc">[+ architecture | history | linguistics | psychology | math | game design]</text>
  <!-- Arrow -->
  <text x="600" y="392" text-anchor="middle" font-family="monospace" font-size="18" fill="#64748b">&#x25BC;</text>
  <text x="600" y="406" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#484f58">transition: search for structure</text>
  <!-- Phase 3 -->
  <rect x="40" y="415" width="1120" height="85" rx="8" fill="url(#diffAdd)" filter="url(#shadow)"/>
  <rect x="40" y="415" width="1120" height="22" rx="8" fill="rgba(0,0,0,0.35)"/>
  <text x="56" y="430" font-family="monospace" font-size="9" fill="#f0f6fc" font-weight="600">diff --phase 2..3  (cross-pollination)</text>
  <text x="1095" y="430" font-family="monospace" font-size="8" fill="#8b949e">+structural only</text>
  <text x="56" y="453" font-family="monospace" font-size="10" fill="#f0f6fc">~ shared patterns       underlying structural similarity</text>
  <text x="56" y="469" font-family="monospace" font-size="10" fill="#f0f6fc">-&gt; transferable ideas    methods crossing domain boundaries</text>
  <text x="56" y="485" font-family="monospace" font-size="10" fill="#f0f6fc">~ analogous systems       parallel mechanics under the surface</text>
  <text x="56" y="501" font-family="monospace" font-size="10" fill="#f0f6fc">[reject superficial connections — structural matches only]</text>
  <!-- Arrow -->
  <text x="600" y="537" text-anchor="middle" font-family="monospace" font-size="18" fill="#64748b">&#x25BC;</text>
  <text x="600" y="551" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#484f58">transition: be skeptical</text>
  <!-- Phase 4 -->
  <rect x="40" y="560" width="1120" height="85" rx="8" fill="url(#diffDel)" filter="url(#shadow)"/>
  <rect x="40" y="560" width="1120" height="22" rx="8" fill="rgba(0,0,0,0.35)"/>
  <text x="56" y="575" font-family="monospace" font-size="9" fill="#f0f6fc" font-weight="600">diff --phase 3..4  (challenge / discard)</text>
  <text x="1095" y="575" font-family="monospace" font-size="8" fill="#f87171">-remove weak</text>
  <text x="56" y="598" font-family="monospace" font-size="10" fill="#f0f6fc">? realistic? evidence? prior art? failure modes? opportunity cost?</text>
  <text x="56" y="614" font-family="monospace" font-size="10" fill="#3fb950">+ strong:   survives all challenges, has novel value</text>
  <text x="56" y="630" font-family="monospace" font-size="10" fill="#d29922">~ moderate  carries risk, needs validation</text>
  <text x="56" y="646" font-family="monospace" font-size="10" fill="#f85149">- weak:     discarded with documented reason</text>
  <!-- Arrow -->
  <text x="600" y="680" text-anchor="middle" font-family="monospace" font-size="18" fill="#64748b">&#x25BC;</text>
  <text x="600" y="694" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#484f58">transition: prove reasoning</text>
  <!-- Phase 5 -->
  <rect x="40" y="702" width="1120" height="85" rx="8" fill="url(#diffAdd)" filter="url(#shadow)"/>
  <rect x="40" y="702" width="1120" height="22" rx="8" fill="rgba(0,0,0,0.35)"/>
  <text x="56" y="717" font-family="monospace" font-size="9" fill="#f0f6fc" font-weight="600">diff --phase 4..5  (final synthesis)</text>
  <text x="1095" y="717" font-family="monospace" font-size="8" fill="#8b949e">+provenance</text>
  <text x="56" y="740" font-family="monospace" font-size="10" fill="#f0f6fc">= strongest insights      with full provenance trail</text>
  <text x="56" y="756" font-family="monospace" font-size="10" fill="#f0f6fc">= unexpected connections   cross-domain structural analogies</text>
  <text x="56" y="772" font-family="monospace" font-size="10" fill="#f0f6fc">= novel concepts           genuinely new, not restatements</text>
  <text x="56" y="788" font-family="monospace" font-size="10" fill="#f0f6fc">[= recommendations | open questions | future directions]</text>
</svg>