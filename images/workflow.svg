<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="p1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="p2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="p3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="p4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="p5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arr-w" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="640" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9" letter-spacing="0.5">CrossThink — Five-Phase Reasoning Workflow</text>

  <!-- Subtitle -->
  <text x="450" y="64" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#94a3b8">Separation of exploration, independent analysis, synthesis, and critical evaluation</text>

  <!-- ============ Phase 1 ============ -->
  <rect x="170" y="85" width="260" height="80" rx="14" fill="url(#p1)" filter="url(#shadow)"/>
  <g transform="translate(200, 100)">
    <!-- Brain icon (simplified) -->
    <circle cx="12" cy="12" r="10" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <line x1="12" y1="2" x2="12" y2="7" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <line x1="12" y1="17" x2="12" y2="22" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <line x1="2" y1="12" x2="7" y2="12" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <line x1="17" y1="12" x2="22" y2="12" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <circle cx="6" cy="6" r="1.5" fill="rgba(255,255,255,0.5)"/>
    <circle cx="18" cy="6" r="1.5" fill="rgba(255,255,255,0.5)"/>
    <circle cx="6" cy="18" r="1.5" fill="rgba(255,255,255,0.5)"/>
  </g>
  <text x="300" y="116" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff">1. Primary Exploration</text>
  <text x="300" y="136" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">Topic deep dive · 7+ dimensions · stop at diminishing returns</text>

  <!-- Arrow 1→2 -->
  <line x1="430" y1="125" x2="470" y2="125" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ============ Phase 2 ============ -->
  <rect x="480" y="85" width="250" height="80" rx="14" fill="url(#p2)" filter="url(#shadow)"/>
  <g transform="translate(510, 100)">
    <!-- Globe icon -->
    <circle cx="14" cy="14" r="11" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <ellipse cx="14" cy="14" rx="6" ry="11" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <line x1="3" y1="14" x2="25" y2="14" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <line x1="14" y1="3" x2="14" y2="25" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  </g>
  <text x="605" y="116" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff">2. Independent Domains</text>
  <text x="605" y="136" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">2–4 distant domains · biology · economics · aviation · architecture</text>

  <!-- Arrow 2→3 -->
  <line x1="605" y1="165" x2="605" y2="200" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- Horizontal connector then down -->
  <line x1="605" y1="165" x2="450" y2="165" stroke="#64748b" stroke-width="2.5"/>
  <line x1="450" y1="165" x2="450" y2="200" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ============ Phase 3 ============ -->
  <rect x="170" y="203" width="260" height="80" rx="14" fill="url(#p3)" filter="url(#shadow)"/>
  <g transform="translate(200, 218)">
    <!-- Merge/connection icon -->
    <circle cx="8" cy="8" r="6" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="6" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <circle cx="14" cy="12" r="3" fill="rgba(255,255,255,0.5)"/>
  </g>
  <text x="300" y="234" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff">3. Cross-Pollination</text>
  <text x="300" y="254" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">Structural patterns · transferable ideas · hidden assumptions</text>

  <!-- Arrow 3→4 -->
  <line x1="430" y1="243" x2="470" y2="243" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr-w)"/>

  <!-- ============ Phase 4 ============ -->
  <rect x="480" y="203" width="250" height="80" rx="14" fill="url(#p4)" filter="url(#shadow)"/>
  <g transform="translate(510, 218)">
    <!-- Shield/check icon -->
    <path d="M10 2 L22 6 L22 14 C22 18 17 22 10 23 C3 22 -2 18 -2 14 L-2 6 Z" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <polyline points="8,13 12,17 18,10" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="605" y="234" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff">4. Challenge</text>
  <text x="605" y="254" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">Realism · assumptions · evidence · failure modes · discard weak</text>

  <!-- Arrow 4→5 -->
  <line x1="605" y1="283" x2="605" y2="318" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- Horizontal connector then down -->
  <line x1="605" y1="283" x2="450" y2="283" stroke="#64748b" stroke-width="2.5"/>
  <line x1="450" y1="283" x2="450" y2="318" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ============ Phase 5 ============ -->
  <rect x="170" y="321" width="260" height="80" rx="14" fill="url(#p5)" filter="url(#shadow)"/>
  <g transform="translate(200, 336)">
    <!-- Lightbulb/star icon -->
    <path d="M12 2 L14 10 L22 10 L16 15 L18 23 L12 18 L6 23 L8 15 L2 10 L10 10 Z" fill="rgba(255,255,255,0.3)"/>
  </g>
  <text x="300" y="352" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff">5. Final Synthesis</text>
  <text x="300" y="372" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">&gt;5 dimensions · strongest insights · novel concepts · provenance explained</text>

  <!-- ============ Side annotations ============ -->

  <!-- Left: Key principles -->
  <rect x="20" y="85" width="130" height="316" rx="10" fill="rgba(15,23,42,0.6)" stroke="rgba(100,116,139,0.3)" stroke-width="1"/>
  <text x="85" y="108" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">PRINCIPLES</text>
  <text x="30" y="130" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#cbd5e1">① Generate freely — no evaluation in phases 1–2</text>
  <text x="30" y="150" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#cbd5e1">② Detach completely — Phase 2 is truly independent</text>
  <text x="30" y="170" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#cbd5e1">③ Find structure — not surface analogies in Phase 3</text>
  <text x="30" y="190" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#cbd5e1">④ Be skeptical — evaluate rigorously in Phase 4</text>
  <text x="30" y="210" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#cbd5e1">⑤ Prove your reasoning — every insight needs provenance</text>
  <text x="30" y="240" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#64748b">⚠ Guardrails</text>
  <text x="30" y="260" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#94a3b8">• Never force connections</text>
  <text x="30" y="278" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#94a3b8">• Never skip Phase 4</text>
  <text x="30" y="296" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#94a3b8">• Never evaluate during exploration</text>
  <text x="30" y="314" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#94a3b8">• Quality > quantity always</text>

  <!-- Right: Failure modes + evaluation -->
  <rect x="750" y="85" width="130" height="316" rx="10" fill="rgba(15,23,42,0.6)" stroke="rgba(100,116,139,0.3)" stroke-width="1"/>
  <text x="815" y="108" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">FAILURE MODES</text>
  <text x="770" y="130" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#f87171">✗ Shallow exploration</text>
  <text x="770" y="150" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#f87171">✗ Anchoring bias</text>
  <text x="770" y="170" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#f87171">✗ Forced connections</text>
  <text x="770" y="190" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#f87171">✗ Premature synthesis</text>
  <text x="770" y="210" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#f87171">✗ yes-machining</text>
  <text x="770" y="230" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#f87171">✗ Domain selection bias</text>
  <text x="770" y="260" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">EVALUATION</text>
  <text x="770" y="280" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#94a3b8">✓ All 5 phases executed</text>
  <text x="770" y="298" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#94a3b8">✓ Ideas rated Strong/Weak</text>
  <text x="770" y="316" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#94a3b8">✓ Non-obvious connections</text>
  <text x="770" y="334" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#94a3b8">✓ Insights have provenance</text>

  <!-- Bottom footer -->
  <text x="450" y="470" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#64748b">CrossThink — a structured reasoning methodology that reduces anchoring bias</text>
  <text x="450" y="490" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#475569">Built for OpenCode · Claude Code · Codex · any AI coding agent</text>
</svg>